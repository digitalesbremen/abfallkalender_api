name: Build docker and push

# Triggered by release.yml, which creates the tag and the GitHub release.
# A tag created with GITHUB_TOKEN does not start further workflows, so this
# workflow is called directly instead of listening for a tag push.
# workflow_dispatch stays available for rebuilding an existing version by hand.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build (git tag name, e.g. 0.0.20)'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (git tag name, e.g. 0.0.20)'
        type: string
        required: true

env:
  IMAGE_NAME: larmic/abfallkalender_api

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  dockerhub:
    name: Build and push DockerHub image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}

      # No QEMU: the Dockerfile cross-compiles via BUILDPLATFORM/TARGETARCH,
      # so every architecture is built natively on the amd64 runner.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}

      # TARGET: runner-standard (clean image without the Lambda adapter).
      # The runner-lambda target stays in the Dockerfile but is built manually
      # when an AWS deployment is due -- see infra/README.md.
      - name: Build and push image to DockerHub
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-standard
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: VERSION=${{ inputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          pull: true
          cache-from: type=gha,scope=standard
          cache-to: type=gha,mode=max,scope=standard
